<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDisc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070E20" />
      <stop offset="50%" stop-color="#0E1E3D" />
      <stop offset="100%" stop-color="#050B17" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="24" fill="url(#bgDisc)" />
  <rect width="800" height="600" rx="24" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Blueprint Grid Pattern -->
  <g opacity="0.15" stroke="#93C5FD" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="600" stroke-dasharray="4 4" />
    <line x1="160" y1="0" x2="160" y2="600" stroke-dasharray="4 4" />
    <line x1="240" y1="0" x2="240" y2="600" stroke-dasharray="4 4" />
    <line x1="320" y1="0" x2="320" y2="600" stroke-dasharray="4 4" />
    <line x1="400" y1="0" x2="400" y2="600" stroke-dasharray="4 4" />
    <line x1="480" y1="0" x2="480" y2="600" stroke-dasharray="4 4" />
    <line x1="560" y1="0" x2="560" y2="600" stroke-dasharray="4 4" />
    <line x1="640" y1="0" x2="640" y2="600" stroke-dasharray="4 4" />
    <line x1="720" y1="0" x2="720" y2="600" stroke-dasharray="4 4" />

    <line x1="0" y1="80" x2="800" y2="80" stroke-dasharray="4 4" />
    <line x1="0" y1="160" x2="800" y2="160" stroke-dasharray="4 4" />
    <line x1="0" y1="240" x2="800" y2="240" stroke-dasharray="4 4" />
    <line x1="0" y1="320" x2="800" y2="320" stroke-dasharray="4 4" />
    <line x1="0" y1="400" x2="800" y2="400" stroke-dasharray="4 4" />
    <line x1="0" y1="480" x2="800" y2="480" stroke-dasharray="4 4" />
    <line x1="0" y1="540" x2="800" y2="540" stroke-dasharray="4 4" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="400" cy="300" r="160" fill="#2563EB" opacity="0.22" filter="url(#glow)" />
  <circle cx="580" cy="180" r="100" fill="#60A5FA" opacity="0.15" filter="url(#glow)" />

  <!-- Radar / Discovery Rings -->
  <g opacity="0.4" stroke="#60A5FA" stroke-width="1.5">
    <circle cx="400" cy="300" r="220" stroke-dasharray="8 8" fill="none" />
    <circle cx="400" cy="300" r="160" fill="none" />
    <circle cx="400" cy="300" r="100" stroke-dasharray="4 6" fill="none" />
    <circle cx="400" cy="300" r="40" fill="none" />
    <!-- Crosshairs -->
    <line x1="160" y1="300" x2="640" y2="300" stroke-opacity="0.3" />
    <line x1="400" y1="70" x2="400" y2="530" stroke-opacity="0.3" />
  </g>

  <!-- Central Isometric Glass Slate -->
  <g transform="translate(0, -10)">
    <!-- Glass Panel Shadow -->
    <polygon points="400,160 620,270 400,380 180,270" fill="rgba(0,0,0,0.4)" filter="url(#glow)" />
    <!-- Glass Panel Base -->
    <polygon points="400,150 620,260 400,370 180,260" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
    <!-- Upper Specular Highlight Edge -->
    <line x1="180" y1="260" x2="400" y2="150" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.7" />
    <line x1="400" y1="150" x2="620" y2="260" stroke="#93C5FD" stroke-width="1.5" stroke-opacity="0.5" />

    <!-- Isometric Data Nodes & Pillars -->
    <!-- Pillar 1 -->
    <polygon points="340,240 370,225 370,175 340,190" fill="#1D4ED8" opacity="0.8" />
    <polygon points="370,225 400,240 400,190 370,175" fill="#3B82F6" />
    <polygon points="340,190 370,175 400,190 370,205" fill="#93C5FD" />

    <!-- Pillar 2 (Tall Central) -->
    <polygon points="380,290 420,270 420,180 380,200" fill="#1E40AF" opacity="0.9" />
    <polygon points="420,270 460,290 460,200 420,180" fill="#2563EB" />
    <polygon points="380,200 420,180 460,200 420,220" fill="#BFDBFE" />

    <!-- Pillar 3 -->
    <polygon points="440,240 470,225 470,165 440,180" fill="#1D4ED8" opacity="0.8" />
    <polygon points="470,225 500,240 500,180 470,165" fill="#60A5FA" />
    <polygon points="440,180 470,165 500,180 470,195" fill="#DBEAFE" />

    <!-- Floating Holographic Nodes & Connections -->
    <line x1="280" y1="230" x2="370" y2="175" stroke="#60A5FA" stroke-width="2" stroke-dasharray="3 3" />
    <line x1="370" y1="175" x2="420" y2="180" stroke="#93C5FD" stroke-width="2" />
    <line x1="420" y1="180" x2="470" y2="165" stroke="#93C5FD" stroke-width="2" />
    <line x1="470" y1="165" x2="540" y2="210" stroke="#60A5FA" stroke-width="2" stroke-dasharray="3 3" />

    <!-- Focal Discovery Node Marker -->
    <circle cx="420" cy="180" r="14" fill="#1D4ED8" opacity="0.4" filter="url(#glow)" />
    <circle cx="420" cy="180" r="6" fill="#FFFFFF" />
    <circle cx="280" cy="230" r="5" fill="#60A5FA" />
    <circle cx="540" cy="210" r="5" fill="#60A5FA" />
  </g>

  <!-- Badge Top-Left -->
  <g transform="translate(48, 48)">
    <rect width="180" height="34" rx="8" fill="rgba(30,58,138,0.5)" stroke="rgba(147,197,253,0.3)" stroke-width="1" />
    <circle cx="16" cy="17" r="4" fill="#3B82F6" />
    <text x="28" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#93C5FD" letter-spacing="1.5">01 // DISCOVER</text>
  </g>

  <!-- Telemetry Coordinates Bottom-Right -->
  <g transform="translate(560, 520)" opacity="0.7">
    <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#93C5FD">LAT: 37.7749° N</text>
    <text x="0" y="36" font-family="'JetBrains Mono', monospace" font-size="11" fill="#93C5FD">LNG: 122.4194° W</text>
    <text x="120" y="28" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#60A5FA">[ANALYSIS ACTIVE]</text>
  </g>
</svg>
