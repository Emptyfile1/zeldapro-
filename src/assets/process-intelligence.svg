<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgIntel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05081C" />
      <stop offset="50%" stop-color="#0C1538" />
      <stop offset="100%" stop-color="#030612" />
    </linearGradient>
    <linearGradient id="aiCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="glowAI" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="24" fill="url(#bgIntel)" />
  <rect width="800" height="600" rx="24" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="400" cy="300" r="180" fill="#3B82F6" opacity="0.22" filter="url(#glowAI)" />
  <circle cx="400" cy="300" r="90" fill="#60A5FA" opacity="0.35" filter="url(#glowAI)" />

  <!-- Synaptic Orbital Neural Rings -->
  <g fill="none" stroke="#60A5FA" stroke-width="1.5" opacity="0.4">
    <ellipse cx="400" cy="300" rx="260" ry="110" transform="rotate(-20 400 300)" stroke-dasharray="6 6" />
    <ellipse cx="400" cy="300" rx="260" ry="110" transform="rotate(35 400 300)" stroke-dasharray="4 4" />
    <circle cx="400" cy="300" r="190" stroke-dasharray="8 8" />
  </g>

  <!-- Neural Mesh Layer Nodes -->
  <!-- Input Layer (Left) -->
  <g stroke="#93C5FD" stroke-width="1.5" opacity="0.8">
    <line x1="220" y1="180" x2="310" y2="230" />
    <line x1="220" y1="180" x2="310" y2="300" />
    <line x1="220" y1="260" x2="310" y2="230" />
    <line x1="220" y1="260" x2="310" y2="370" />
    <line x1="220" y1="340" x2="310" y2="300" />
    <line x1="220" y1="340" x2="310" y2="370" />
    <line x1="220" y1="420" x2="310" y2="370" />
  </g>

  <!-- Hidden Layer 1 to Core -->
  <g stroke="#60A5FA" stroke-width="2" opacity="0.85">
    <line x1="310" y1="230" x2="400" y2="300" />
    <line x1="310" y1="300" x2="400" y2="300" />
    <line x1="310" y1="370" x2="400" y2="300" />
    <line x1="400" y1="300" x2="490" y2="230" />
    <line x1="400" y1="300" x2="490" y2="300" />
    <line x1="400" y1="300" x2="490" y2="370" />
  </g>

  <!-- Output Layer (Right) -->
  <g stroke="#93C5FD" stroke-width="1.5" opacity="0.8">
    <line x1="490" y1="230" x2="580" y2="200" />
    <line x1="490" y1="230" x2="580" y2="280" />
    <line x1="490" y1="300" x2="580" y2="280" />
    <line x1="490" y1="370" x2="580" y2="360" />
    <line x1="490" y1="370" x2="580" y2="420" />
  </g>

  <!-- Input Nodes -->
  <circle cx="220" cy="180" r="7" fill="#1D4ED8" stroke="#93C5FD" stroke-width="2" />
  <circle cx="220" cy="260" r="7" fill="#1D4ED8" stroke="#93C5FD" stroke-width="2" />
  <circle cx="220" cy="340" r="7" fill="#1D4ED8" stroke="#93C5FD" stroke-width="2" />
  <circle cx="220" cy="420" r="7" fill="#1D4ED8" stroke="#93C5FD" stroke-width="2" />

  <!-- Hidden Nodes -->
  <circle cx="310" cy="230" r="9" fill="#2563EB" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="310" cy="300" r="9" fill="#2563EB" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="310" cy="370" r="9" fill="#2563EB" stroke="#FFFFFF" stroke-width="2" />

  <circle cx="490" cy="230" r="9" fill="#2563EB" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="490" cy="300" r="9" fill="#2563EB" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="490" cy="370" r="9" fill="#2563EB" stroke="#FFFFFF" stroke-width="2" />

  <!-- Output Decision Nodes -->
  <circle cx="580" cy="200" r="7" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="580" cy="280" r="7" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="580" cy="360" r="7" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="580" cy="420" r="7" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />

  <!-- Central Cognitive Core (Diamond / Neural Brain Matrix) -->
  <g transform="translate(400, 300)">
    <polygon points="0,-48 48,0 0,48 -48,0" fill="url(#aiCoreGrad)" stroke="#FFFFFF" stroke-width="2.5" filter="url(#glowAI)" />
    <!-- Inner Facets -->
    <polygon points="0,-48 48,0 0,0" fill="#93C5FD" opacity="0.7" />
    <polygon points="48,0 0,48 0,0" fill="#2563EB" opacity="0.8" />
    <polygon points="0,48 -48,0 0,0" fill="#1D4ED8" opacity="0.9" />
    <polygon points="-48,0 0,-48 0,0" fill="#60A5FA" opacity="0.75" />
    <circle cx="0" cy="0" r="10" fill="#FFFFFF" filter="url(#glowAI)" />
  </g>

  <!-- Badge Top-Left -->
  <g transform="translate(48, 48)">
    <rect width="190" height="34" rx="8" fill="rgba(30,58,138,0.5)" stroke="rgba(147,197,253,0.3)" stroke-width="1" />
    <circle cx="16" cy="17" r="4" fill="#38BDF8" />
    <text x="28" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#BAE6FD" letter-spacing="1.5">04 // INTELLIGENCE</text>
  </g>

  <!-- Prediction Metrics Bottom -->
  <g transform="translate(48, 520)" opacity="0.75">
    <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#93C5FD">MODEL: MULTI-AGENT RAG / LLM</text>
    <text x="0" y="36" font-family="'JetBrains Mono', monospace" font-size="11" fill="#93C5FD">CONFIDENCE: 99.4% PREDICTIVE</text>
    <text x="260" y="28" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#60A5FA">[AUTONOMOUS COGNITION]</text>
  </g>
</svg>
