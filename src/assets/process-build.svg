<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBuild" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060C1F" />
      <stop offset="50%" stop-color="#0E1A3D" />
      <stop offset="100%" stop-color="#050B18" />
    </linearGradient>
    <linearGradient id="bBlue1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="bCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="glowB" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="24" fill="url(#bgBuild)" />
  <rect width="800" height="600" rx="24" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="400" cy="300" r="170" fill="#1D4ED8" opacity="0.25" filter="url(#glowB)" />
  <circle cx="280" cy="220" r="100" fill="#60A5FA" opacity="0.15" filter="url(#glowB)" />

  <!-- Isometric Architectural Modular Blocks -->
  <g transform="translate(400, 310)">
    <!-- Base Platform Slab -->
    <polygon points="0,-40 220,70 0,180 -220,70" fill="rgba(15,23,42,0.7)" stroke="rgba(147,197,253,0.3)" stroke-width="2" />
    <polygon points="-220,70 0,180 0,205 -220,95" fill="#0A1128" />
    <polygon points="0,180 220,70 220,95 0,205" fill="#101F42" />

    <!-- Grid lines on base platform -->
    <line x1="-110" y1="15" x2="110" y2="125" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3 3" />
    <line x1="-110" y1="125" x2="110" y2="15" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3 3" />

    <!-- Block 1: Left Module (Web / API) -->
    <g transform="translate(-110, 15)">
      <polygon points="0,-45 65,-12 0,20 -65,-12" fill="url(#bBlue1)" stroke="#93C5FD" stroke-width="1.5" />
      <polygon points="-65,-12 0,20 0,65 -65,33" fill="#1E40AF" />
      <polygon points="0,20 65,-12 65,33 0,65" fill="#1D4ED8" />
      <!-- Top Decal -->
      <circle cx="0" cy="-12" r="6" fill="#DBEAFE" />
    </g>

    <!-- Block 2: Right Module (Data Engine) -->
    <g transform="translate(100, 20)">
      <polygon points="0,-45 65,-12 0,20 -65,-12" fill="url(#bCyan)" stroke="#93C5FD" stroke-width="1.5" />
      <polygon points="-65,-12 0,20 0,55 -65,23" fill="#1E3A8A" />
      <polygon points="0,20 65,-12 65,23 0,55" fill="#2563EB" />
      <!-- Top Decal -->
      <circle cx="0" cy="-12" r="6" fill="#FFFFFF" />
    </g>

    <!-- Block 3: Central High-Performance Core (Elevated / Floating) -->
    <g transform="translate(0, -90)">
      <!-- Projection Beams to Base -->
      <line x1="0" y1="65" x2="0" y2="140" stroke="#60A5FA" stroke-width="2" stroke-dasharray="3 3" opacity="0.7" />
      <line x1="-75" y1="28" x2="-110" y2="105" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5" />
      <line x1="75" y1="28" x2="100" y2="110" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5" />

      <!-- Center Hexagonal Glass Node -->
      <polygon points="0,-55 75,-17 0,22 -75,-17" fill="rgba(255,255,255,0.18)" stroke="#FFFFFF" stroke-width="2" />
      <polygon points="-75,-17 0,22 0,72 -75,33" fill="#1D4ED8" opacity="0.85" />
      <polygon points="0,22 75,-17 75,33 0,72" fill="#3B82F6" opacity="0.9" />

      <!-- Code Bracket Motif `< / >` -->
      <text x="0" y="5" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">&lt; / &gt;</text>
    </g>
  </g>

  <!-- Code Floating Terminal Windows (Left) -->
  <g transform="translate(56, 170)">
    <rect width="180" height="110" rx="10" fill="rgba(15,23,42,0.85)" stroke="rgba(147,197,253,0.3)" stroke-width="1.5" />
    <circle cx="16" cy="16" r="4" fill="#EF4444" />
    <circle cx="28" cy="16" r="4" fill="#F59E0B" />
    <circle cx="40" cy="16" r="4" fill="#10B981" />
    <line x1="16" y1="38" x2="90" y2="38" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" />
    <line x1="16" y1="52" x2="150" y2="52" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <line x1="16" y1="66" x2="120" y2="66" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <line x1="16" y1="80" x2="70" y2="80" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Badge Top-Left -->
  <g transform="translate(48, 48)">
    <rect width="180" height="34" rx="8" fill="rgba(30,58,138,0.5)" stroke="rgba(147,197,253,0.3)" stroke-width="1" />
    <circle cx="16" cy="17" r="4" fill="#3B82F6" />
    <text x="28" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#93C5FD" letter-spacing="1.5">03 // BUILD</text>
  </g>

  <!-- Bottom Telemetry Status -->
  <g transform="translate(520, 520)" opacity="0.75">
    <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#93C5FD">INFRASTRUCTURE: AS-CODE</text>
    <text x="0" y="36" font-family="'JetBrains Mono', monospace" font-size="11" fill="#93C5FD">BUILD STATUS: PASSING (100%)</text>
    <text x="0" y="52" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#60A5FA">[CI/CD PIPELINE VERIFIED]</text>
  </g>
</svg>
