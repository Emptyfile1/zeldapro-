<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDeploy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C1F" />
      <stop offset="50%" stop-color="#0E1D3D" />
      <stop offset="100%" stop-color="#040A18" />
    </linearGradient>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <filter id="glowD" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="24" fill="url(#bgDeploy)" />
  <rect width="800" height="600" rx="24" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="400" cy="300" r="170" fill="#2563EB" opacity="0.25" filter="url(#glowD)" />
  <circle cx="520" cy="200" r="110" fill="#60A5FA" opacity="0.18" filter="url(#glowD)" />

  <!-- Global Wireframe Sphere / Network Globe -->
  <g transform="translate(400, 300)">
    <!-- Globe Outer Ring -->
    <circle cx="0" cy="0" r="150" fill="url(#globeGrad)" fill-opacity="0.15" stroke="#60A5FA" stroke-width="2" />
    <!-- Latitudes -->
    <ellipse cx="0" cy="0" rx="150" ry="60" fill="none" stroke="#93C5FD" stroke-width="1.2" stroke-opacity="0.5" />
    <ellipse cx="0" cy="0" rx="150" ry="110" fill="none" stroke="#93C5FD" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="4 4" />
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#93C5FD" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Longitudes -->
    <ellipse cx="0" cy="0" rx="60" ry="150" fill="none" stroke="#93C5FD" stroke-width="1.2" stroke-opacity="0.5" />
    <ellipse cx="0" cy="0" rx="110" ry="150" fill="none" stroke="#93C5FD" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="4 4" />
    <line x1="0" y1="-150" x2="0" y2="150" stroke="#93C5FD" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Orbiting Deployment Launch Ring -->
    <ellipse cx="0" cy="0" rx="210" ry="75" transform="rotate(-25)" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.75" />

    <!-- Distributed Edge Cloud Nodes on Globe -->
    <!-- Node 1: North America -->
    <circle cx="-50" cy="-40" r="6" fill="#FFFFFF" filter="url(#glowD)" />
    <circle cx="-50" cy="-40" r="12" fill="#3B82F6" opacity="0.4" />
    <!-- Node 2: Europe -->
    <circle cx="30" cy="-60" r="6" fill="#FFFFFF" filter="url(#glowD)" />
    <circle cx="30" cy="-60" r="12" fill="#3B82F6" opacity="0.4" />
    <!-- Node 3: Asia-Pacific -->
    <circle cx="90" cy="-10" r="6" fill="#FFFFFF" filter="url(#glowD)" />
    <circle cx="90" cy="-10" r="12" fill="#3B82F6" opacity="0.4" />
    <!-- Node 4: South America -->
    <circle cx="-30" cy="70" r="5" fill="#93C5FD" />
    <!-- Node 5: Africa -->
    <circle cx="20" cy="30" r="5" fill="#93C5FD" />

    <!-- Inter-region Transit Arcs -->
    <path d="M -50 -40 Q -10 -90 30 -60" fill="none" stroke="#60A5FA" stroke-width="2" stroke-dasharray="3 3" />
    <path d="M 30 -60 Q 60 -50 90 -10" fill="none" stroke="#60A5FA" stroke-width="2" stroke-dasharray="3 3" />
    <path d="M -50 -40 Q -40 20 -30 70" fill="none" stroke="#60A5FA" stroke-width="1.5" />
    <path d="M 30 -60 Q 25 -10 20 30" fill="none" stroke="#60A5FA" stroke-width="1.5" />

    <!-- Orbit Satellite / Rocket / Shard Marker -->
    <g transform="translate(180, -75)">
      <polygon points="0,-14 16,0 0,14 -4,0" fill="#38BDF8" filter="url(#glowD)" />
      <circle cx="-6" cy="0" r="3" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Enterprise Security & Uptime Crest (Left) -->
  <g transform="translate(56, 170)">
    <rect width="180" height="120" rx="12" fill="rgba(15,23,42,0.85)" stroke="rgba(147,197,253,0.3)" stroke-width="1.5" />
    <!-- Shield Icon -->
    <path d="M 32 30 Q 32 60 52 75 Q 72 60 72 30 L 52 22 Z" fill="#1D4ED8" stroke="#60A5FA" stroke-width="2" />
    <path d="M 44 48 L 50 54 L 62 38" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="84" y="42" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF">ENTERPRISE</text>
    <text x="84" y="60" font-family="'JetBrains Mono', monospace" font-size="11" fill="#93C5FD">UPTIME 99.99%</text>
    <text x="84" y="78" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34D399">ZERO DOWNTIME</text>
  </g>

  <!-- Badge Top-Left -->
  <g transform="translate(48, 48)">
    <rect width="180" height="34" rx="8" fill="rgba(30,58,138,0.5)" stroke="rgba(147,197,253,0.3)" stroke-width="1" />
    <circle cx="16" cy="17" r="4" fill="#3B82F6" />
    <text x="28" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#93C5FD" letter-spacing="1.5">05 // DEPLOY</text>
  </g>

  <!-- Bottom Telemetry Status -->
  <g transform="translate(520, 520)" opacity="0.75">
    <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#93C5FD">REGION: GLOBAL MULTI-ZONE</text>
    <text x="0" y="36" font-family="'JetBrains Mono', monospace" font-size="11" fill="#93C5FD">LATENCY: &lt; 25ms EDGE</text>
    <text x="0" y="52" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38BDF8">[SYSTEMS LIVE &amp; SCALING]</text>
  </g>
</svg>
